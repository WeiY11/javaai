spring:
  datasource:
    url: jdbc:h2:file:./data/javaai-dev
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  elasticsearch:
    uris: http://localhost:9200

minio:
  enabled: false
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: javaai-documents

jwt:
  secret: dev-only-secret-key-for-local-testing-2026
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
