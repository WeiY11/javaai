spring:
  datasource:
    url: jdbc:h2:file:./data/evimind-dev
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  elasticsearch:
    uris: http://localhost:9200

minio:
  enabled: false
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: evimind-documents

jwt:
  secret: dev-only-secret-key-for-local-testing-2026
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

custom:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
