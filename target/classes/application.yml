spring:
  application:
    name: evimind
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:evimind}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:evimind-documents}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

custom:
  ai:
    embedding:
      enabled: true
      base-url: ${EMBEDDING_BASE_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:}
      dimension: 1536
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY}
        model: deepseek-chat
        temperature: 0.7
      zhipu:
        base-url: https://open.bigmodel.cn/api/paas/v4/
        api-key: ${ZHIPU_API_KEY}
        model: glm-4
        temperature: 0.7
      qianwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QIANWEN_API_KEY}
        model: qwen-turbo
        temperature: 0.7
      openai:
        base-url: https://api.openai.com/v1
        api-key: ${OPENAI_API_KEY}
        model: gpt-3.5-turbo
        temperature: 0.7
  data:
    base-dir: ${DATA_BASE_DIR:/data}
  rag:
    max-evidence-context-chars: ${RAG_MAX_EVIDENCE_CONTEXT_CHARS:6000}
    search:
      backend-timeout-ms: ${RAG_SEARCH_BACKEND_TIMEOUT_MS:1500}
  analysis:
    max-content-size: 512000
    max-prompt-size: 100000
    batch-max-files: 20
    result-dir: .analysis-results
    report-dir: .analysis-reports
    pdf-font-path: ""

server:
  port: 8080

logging:
  level:
    com.example.evimind: INFO
    org.springframework.ai: DEBUG
